name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
        working-directory: .

      - name: Generate placeholder assets if missing
        run: |
          python3 << 'PY'
          import struct, zlib
          from pathlib import Path
          def write_png(path, w, h, rgba_fn):
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)
              raw = bytearray()
              for y in range(h):
                  raw.append(0)
                  for x in range(w):
                      r,g,b,a = rgba_fn(x,y,w,h)
                      raw.extend([r,g,b,a])
              compressed = zlib.compress(bytes(raw), 9)
              ihdr = struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)
              png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', compressed) + chunk(b'IEND', b'')
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_bytes(png)
          BG=(0x0f,0x11,0x15,255); AC=(0x2e,0xc4,0xb6,255); WH=(240,242,245,255)
          def icon(x,y,w,h):
              cx,cy,r=w/2,h/2,w*0.38
              dx,dy=x-cx,y-cy
              if dx*dx+dy*dy<=r*r:
                  if abs(x-cx)<w*0.06 and cy-r*0.35<y<cy+r*0.15: return WH
                  if y>=cy+r*0.05 and y<=cy+r*0.35:
                      half=(y-(cy+r*0.05))*0.9
                      if abs(x-cx)<=half+w*0.04: return WH
                  return AC
              return BG
          def splash(x,y,w,h):
              cx,cy,r=w/2,h/2,min(w,h)*0.12
              dx,dy=x-cx,y-cy
              return AC if dx*dx+dy*dy<=r*r else BG
          root=Path('assets')
          for name,size,fn in [('icon.png',(1024,1024),icon),('adaptive-icon.png',(1024,1024),icon),('splash.png',(1284,2778),splash)]:
              p=root/name
              if not p.exists():
                  write_png(p,*size,fn)
                  print('wrote',p)
          PY

      - name: Install JS dependencies
        run: npm install

      - name: Metro preflight
        run: npx expo export --platform android --output-dir /tmp/expo-out

      - name: Expo prebuild (generate android/)
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Gradle assembleRelease
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Locate APK
        id: apk
        run: |
          set -e
          APK=$(find android -name '*.apk' -type f | head -n 1)
          echo "Found: $APK"
          ls -la "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: queora-apk
          path: app/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
