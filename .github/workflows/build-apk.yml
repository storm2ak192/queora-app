name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate placeholder assets if missing
        run: |
          python3 << 'PY'
          import struct, zlib
          from pathlib import Path
          def write_png(path, w, h, rgba_fn):
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)
              raw = bytearray()
              for y in range(h):
                  raw.append(0)
                  for x in range(w):
                      r,g,b,a = rgba_fn(x,y,w,h)
                      raw.extend([r,g,b,a])
              compressed = zlib.compress(bytes(raw), 9)
              ihdr = struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)
              png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', compressed) + chunk(b'IEND', b'')
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_bytes(png)
          BG=(0x0f,0x11,0x15,255); AC=(0x2e,0xc4,0xb6,255); WH=(240,242,245,255)
          def icon(x,y,w,h):
              cx,cy,r=w/2,h/2,w*0.38
              dx,dy=x-cx,y-cy
              if dx*dx+dy*dy<=r*r:
                  if abs(x-cx)<w*0.06 and cy-r*0.35<y<cy+r*0.15: return WH
                  if y>=cy+r*0.05 and y<=cy+r*0.35:
                      half=(y-(cy+r*0.05))*0.9
                      if abs(x-cx)<=half+w*0.04: return WH
                  return AC
              return BG
          def splash(x,y,w,h):
              cx,cy,r=w/2,h/2,min(w,h)*0.12
              dx,dy=x-cx,y-cy
              return AC if dx*dx+dy*dy<=r*r else BG
          root=Path('assets')
          for name,size,fn in [('icon.png',(1024,1024),icon),('adaptive-icon.png',(1024,1024),icon),('splash.png',(1284,2778),splash)]:
              p=root/name
              if not p.exists():
                  write_png(p,*size,fn)
                  print('wrote',p)
          PY

      - name: Install app dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Login check + create/link Expo project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -e
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is empty"
            exit 1
          fi
          eas whoami

          # Strip invalid placeholder projectId so eas init can write a real one
          python3 << 'PY'
          import json
          from pathlib import Path
          p = Path("app.json")
          c = json.loads(p.read_text())
          expo = c.setdefault("expo", {})
          extra = expo.setdefault("extra", {})
          eas = extra.setdefault("eas", {})
          pid = eas.get("projectId")
          if not pid or pid == "REPLACE_AFTER_eas_init" or "REPLACE" in str(pid):
              eas.pop("projectId", None)
              print("removed placeholder projectId")
          else:
              print("existing projectId:", pid)
          p.write_text(json.dumps(c, indent=2) + "\n")
          PY

          # Create or link project non-interactively
          eas init --non-interactive --force || eas project:init --non-interactive || true

          echo "--- app.json after init ---"
          cat app.json

          # Fail early if still no projectId
          python3 << 'PY'
          import json, sys
          from pathlib import Path
          c = json.loads(Path("app.json").read_text())
          pid = c.get("expo", {}).get("extra", {}).get("eas", {}).get("projectId")
          print("projectId=", pid)
          if not pid or "REPLACE" in str(pid):
              print("ERROR: projectId still missing after eas init")
              sys.exit(1)
          PY

      - name: EAS build (preview APK)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Show latest builds
        if: always()
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build:list --platform android --limit 3 --non-interactive || true
